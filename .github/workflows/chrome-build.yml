name: Chrome validation build
on:
  push:
    branches: [feature/pause-longform-mvp, feature/pause-notes-ui]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:chrome
      - uses: actions/upload-artifact@v4
        with:
          name: pause-chrome-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
